<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form</title>
</head>
<body>
   <h1>Contoh elemen-elemen form di dalam tabel</h1> 

   <form>

    <table cellpadding="4">
        <tr>
            <td align="right">
    <label for="nama">Nama:</td>
            <td> <input type="text" name="nama" id="nama" placeholder="Masukkan nama">
    </label></td>
        </tr>
        <tr>
            <td align="right"><label for="Password">Password:</td>
            <td><input type="password" name="password" id="password">
    </label</td>
        </tr>
        <tr>
            <td align="right"><label for="email">Email:</td>
            <td><input type="email" name="email" id="email">
    </label></td>
        </tr>
        <tr>
            <td align="right"><label for="angka">Angka:</td>
            <td><input type="number" name="number" id="number" min="0" max="100" step="5">
    </label></td>
        </tr>
        <tr>
            <td align="right"><label for="tanggal">Tanggal:</td>
            <td><input type="date" name="tanggal" id="tanggal"></td>
        </tr>
        <tr>
            <td align="right"><label for="warna">Pilih warna</td>
            <td><input type="color" name="warna" id="warna">
        </label></td>
        </tr>
        <tr>
            <td colspan="2">
                <button type="submit">Kirim!</button>
            </td>
            <td></td>
        </tr>
     </table>
    </form>
</body>
</html>
